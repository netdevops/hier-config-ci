[project]
name = "hier-config-ci"
version = "0.1.0"
description = "Release and integration tooling for the hier_config app ecosystem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
hier-config-ci = "hier_config_ci.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hier_config_ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
